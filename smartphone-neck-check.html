<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2C5AA0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>スマホ首セルフチェック ― その症状、大丈夫？</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "BIZ UDPGothic", sans-serif; background: #f0f4f8; color: #333; line-height: 1.6; min-height: 100vh; }
.app-header { background: linear-gradient(135deg, #1B3A5C, #2C5AA0); color: #fff; padding: 16px 20px; text-align: center; }
.app-header h1 { font-size: 1.3rem; margin-bottom: 4px; }
.app-header .series { font-size: 0.8rem; opacity: 0.8; }
.disclaimer { background: #fff3cd; border-left: 4px solid #ffc107; padding: 12px 16px; margin: 12px 16px; border-radius: 4px; font-size: 0.85rem; color: #856404; }
.container { max-width: 600px; margin: 0 auto; padding: 0 16px 80px; }
.step-card { background: #fff; border-radius: 12px; padding: 20px; margin: 16px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.step-number { display: inline-block; background: #2C5AA0; color: #fff; font-size: 0.8rem; padding: 2px 10px; border-radius: 12px; margin-bottom: 8px; }
.step-card h2 { font-size: 1.1rem; color: #1B3A5C; margin-bottom: 12px; }
.step-card p { font-size: 0.95rem; color: #555; margin-bottom: 12px; }
.options { display: flex; flex-direction: column; gap: 8px; }
.option-btn { display: block; width: 100%; padding: 14px 16px; border: 2px solid #dee2e6; border-radius: 8px; background: #fff; font-size: 1rem; font-family: inherit; color: #333; text-align: left; cursor: pointer; transition: all 0.2s; }
.option-btn:hover { border-color: #2C5AA0; background: #f0f6ff; }
.option-btn.selected { border-color: #2C5AA0; background: #e8f4fd; color: #1B3A5C; font-weight: bold; }
.hidden { display: none; }
.result-card { background: #fff; border-radius: 12px; padding: 24px 20px; margin: 16px 0; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
.result-badge { display: inline-block; padding: 6px 16px; border-radius: 20px; font-size: 1.1rem; font-weight: bold; margin-bottom: 12px; }
.badge-red { background: #f8d7da; color: #c0392b; }
.badge-yellow { background: #fff3cd; color: #856404; }
.badge-green { background: #d4edda; color: #155724; }
.result-title { font-size: 1.2rem; color: #1B3A5C; margin-bottom: 8px; }
.result-desc { font-size: 0.95rem; color: #555; margin-bottom: 16px; }
.result-action { background: #f8f9fa; border-radius: 8px; padding: 12px 16px; margin-bottom: 12px; }
.result-action strong { color: #2C5AA0; }
.result-note { font-size: 0.85rem; color: #888; border-top: 1px solid #eee; padding-top: 12px; margin-top: 12px; }
.restart-btn { display: block; width: 100%; padding: 14px; background: #2C5AA0; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-family: inherit; cursor: pointer; margin-top: 12px; }
.restart-btn:hover { background: #1B3A5C; }
.back-link { display: block; text-align: center; padding: 8px 16px; font-size: 0.85rem; color: #fff; text-decoration: none; background: rgba(255,255,255,0.15); }
.back-link:hover { background: rgba(255,255,255,0.25); }
.progress-bar { height: 4px; background: #dee2e6; margin: 0 16px; border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: #2C5AA0; transition: width 0.3s; border-radius: 2px; }
</style>
</head>
<body>
<div class="app-header">
  <a class="back-link" href="index.html">← ツール一覧に戻る</a>
  <div class="series">その症状、大丈夫？ #16</div>
  <h1>スマホ首セルフチェック</h1>
</div>
<div class="disclaimer">このツールは医療行為ではありません。結果は参考情報であり、診断に代わるものではありません。心配な場合は必ず医師にご相談ください。</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
<div class="container">
  <div id="questionArea"></div>
  <div id="resultArea" class="hidden"></div>
</div>
<script>
var questions = [
  {
    id: "location",
    title: "主な症状の部位はどこですか？",
    subtitle: "",
    options: [
      { id: "neck_shoulder", label: "首・肩の痛みやコリ" },
      { id: "fingers_thumb", label: "親指・人差し指・中指のシビれや痛み" },
      { id: "pinky_ring", label: "小指・薬指側のシビれや痛み" },
      { id: "whole_arm", label: "腐から手先まで腕全体のシビれや痛み" },
      { id: "both_hands", label: "両手のシビれ（左右両方）" }
    ]
  },
  {
    id: "trigger",
    title: "症状はどのようなときに起こりやすいですか？",
    subtitle: "",
    options: [
      { id: "device_use", label: "スマホ・パソコン使用中・使用後" },
      { id: "posture", label: "首を下向きにしたり同じ姿勢を続けたとき" },
      { id: "always", label: "姿勢にかかわらず常にある" },
      { id: "sudden", label: "特にきっかけなく突然に出た" }
    ]
  },
  {
    id: "danger_signs",
    title: "次の症状で当てはまるものはありますか？",
    subtitle: "最も強いものを選んでください",
    options: [
      { id: "stroke_signs", label: "言葉がもつれる・顔がゆがむ・片麻症状が出た" },
      { id: "myelopathy", label: "両手のしびれと歩行時のふらつきが出た" },
      { id: "muscle_wasting", label: "手の筋肉が痩せてきた・細かい動きができにくい" },
      { id: "none", label: "上記はない" }
    ]
  },
  {
    id: "duration",
    title: "症状はどのくらい続いていますか？",
    subtitle: "",
    options: [
      { id: "over_month", label: "1ヶ月以上続いている" },
      { id: "over_2weeks", label: "2週間以上続いている" },
      { id: "under_2weeks", label: "2週間未満" },
      { id: "today", label: "今日突然に出た" }
    ]
  },
  {
    id: "screen_time",
    title: "スマホ・パソコンの1日の使用時間は？",
    subtitle: "",
    options: [
      { id: "over6h", label: "6時間以上" },
      { id: "3to6h", label: "3～6時間" },
      { id: "1to3h", label: "1～3時間" },
      { id: "under1h", label: "1時間未満" }
    ]
  },
  {
    id: "posture_relief",
    title: "首や肩の位置を変えたりストレッチすると症状は変わりますか？",
    subtitle: "",
    options: [
      { id: "improves", label: "楽になる／軽くなる" },
      { id: "no_change", label: "変わらない" },
      { id: "worsens", label: "より悪くなる" }
    ]
  }
];

var currentStep = 0;
var answers = {};

function renderQuestion() {
  var area = document.getElementById("questionArea");
  var q = questions[currentStep];
  var pct = Math.round((currentStep / questions.length) * 100);
  document.getElementById("progressFill").style.width = pct + "%";
  var html = '<div class="step-card">';
  html += '<span class="step-number">' + "質問 " + (currentStep + 1) + " / " + questions.length + '</span>';
  html += '<h2>' + q.title + '</h2>';
  if (q.subtitle) { html += '<p>' + q.subtitle + '</p>'; }
  html += '<div class="options">';
  for (var i = 0; i < q.options.length; i++) {
    var opt = q.options[i];
    html += '<button class="option-btn" onclick="selectAnswer(\'' + q.id + '\',\'' + opt.id + '\')">' + opt.label + '</button>';
  }
  html += '</div></div>';
  area.innerHTML = html;
}

function selectAnswer(qId, optId) {
  answers[qId] = optId;
  currentStep++;
  if (currentStep < questions.length) {
    renderQuestion();
    window.scrollTo({ top: 0, behavior: "smooth" });
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById("questionArea").classList.add("hidden");
  document.getElementById("progressFill").style.width = "100%";
  var urgency = calcUrgency();
  var resultArea = document.getElementById("resultArea");
  resultArea.classList.remove("hidden");
  resultArea.innerHTML = buildResultHTML(urgency);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function calcUrgency() {
  if (answers.danger_signs === "stroke_signs") { return "emergency_stroke"; }
  if (answers.danger_signs === "myelopathy") { return "urgent_myelopathy"; }
  if (answers.danger_signs === "muscle_wasting") { return "urgent_muscle_wasting"; }
  if (answers.trigger === "sudden" && answers.duration === "today") { return "urgent_sudden"; }
  if (answers.duration === "over_2weeks" || answers.duration === "over_month") { return "urgent_prolonged"; }
  if (answers.location === "both_hands" || answers.location === "whole_arm") { return "urgent_widespread"; }
  if (answers.trigger === "device_use" && answers.posture_relief === "improves") { return "watch_device"; }
  if (answers.posture_relief === "improves") { return "watch_posture"; }
  return "watch_ok";
}

function buildResultHTML(urgency) {
  var data = {
    emergency_stroke: {
      badge: "badge-red", badgeText: "今すぐ119番へ",
      title: "脳卒中の可能性があります",
      desc: "言葉のもつれや顔の〈6めは、脳卒中の典型的なサインです。首・肩のシビれと同時に出た場合、首の血管トラブルの可能性があります。一刻も早く救急搬送が必要です。",
      action: "<strong>今すぐ119番に電話してください。</strong>時間をおかずにブラウザしないでください。",
      dept: "救急科（119番）"
    },
    urgent_myelopathy: {
      badge: "badge-yellow", badgeText: "早めに受診してください",
      title: "頸髓症の可能性があります",
      desc: "両手のシビれと歩行時のふらつきが一緒に出る場合、頸欯による頸髓圧迫（頸髓症）の可能性が高いです。進行すると暴歩・排中障害に至ることがあるため、早めの精査が必要です。",
      action: "<strong>整形外科または脳神経内科を受診してください。</strong>首・胸椎のMRI検査が必要です。",
      dept: "整形外科・脳神経内科"
    },
    urgent_muscle_wasting: {
      badge: "badge-yellow", badgeText: "早めに受診してください",
      title: "頸椎疾患または神経疾患の精査が必要です",
      desc: "手の筋肉が痩せてきたり、ボタンのほぞ引きなど細かい動作が難しくなった場合、頸欯席による神経圧迫や筋萎縮性側索絡硬化症などの可能性もあります。早めの精査が必要です。",
      action: "<strong>整形外科または脳神経内科を受診してください。</strong>",
      dept: "整形外科・脳神経内科"
    },
    urgent_sudden: {
      badge: "badge-yellow", badgeText: "早めに受診してください",
      title: "突然に出たシビれは脳卒中や首の血管トラブルを除外する必要があります",
      desc: "突然出現の首・腕のシビれは、騈直麻症や脳卒中の可能性があります。症状が数分内に沈静しても、今日中に受診することをおすすめします。",
      action: "<strong>救急外来または脳神経内科を受診してください。</strong>",
      dept: "脳神経内科・救急外来"
    },
    urgent_prolonged: {
      badge: "badge-yellow", badgeText: "受診をおすすめします",
      title: "2週間以上続く症状は精査が必要です",
      desc: "首・肩・手の症状が2週間以上続く場合、頸欯症・胸頸出・綞摔性腁神経痛など治療が必要な病態の可能性があります。自己判断ではなく受診をおすすめします。",
      action: "<strong>整形外科または脳神経内科を受診してください。</strong>レントゲン・MRIによる画像検査が必要なことがあります。",
      dept: "整形外科・脳神経内科"
    },
    urgent_widespread: {
      badge: "badge-yellow", badgeText: "受診をおすすめします",
      title: "広範囲のシビれは筋骸症や頸髓症の除外が必要です",
      desc: "腐から手先まで、または両手に岡るシビれは単純なスマホ首以外の原因が考えられます。頸髓症・周辺神経症・胸郭出口症候群の可能性があります。",
      action: "<strong>整形外科または脳神経内科を受診してください。</strong>",
      dept: "整形外科・脳神経内科"
    },
    watch_device: {
      badge: "badge-green", badgeText: "様子を見ても大丈夫です",
      title: "スマホ・パソコン使用による首の疲労が考えられます",
      desc: "デバイス使用時に首を前に倒す姿勢は、頸欯にかかる荷重を数倍に増やします。姿勢改善と首のストレッチで小康が期待できます。",
      action: "<strong>30分ごとに休憩し、画面を目の高さに合わせましょう。</strong>首のストレッチ（1日数回）も効果的です。症状が2週間以上続く場合は受診を検討してください。",
      dept: "悪化時：整形外科・脳神経内科"
    },
    watch_posture: {
      badge: "badge-green", badgeText: "様子を見ても大丈夫です",
      title: "姿勢改善で軽快する首・肩のコリです",
      desc: "姿勢を変えると楽になる場合、筋肉的な原因が主体である可能性が高いです。パソコン・スマホの使用時間を減らし、首と肩のストレッチを継続することが大切です。",
      action: "<strong>スクリーンの位置を目の高さに調整し、首・肩をストレッチする習慣をつけましょう。</strong>",
      dept: "悪化時：整形外科・脳神経内科"
    },
    watch_ok: {
      badge: "badge-green", badgeText: "様子を見ても大丈夫です",
      title: "現時点で緊急性は低そうです",
      desc: "危険なサインは見られません。スマホ・パソコンの使い過ぎに注意し、首と肩のストレッチを取り入れることで予防できます。",
      action: "<strong>症状が悪化したり、新たな症状が出た場合は受診してください。</strong>",
      dept: "悪化時：整形外科・脳神経内科"
    }
  };

  var d = data[urgency];
  var html = '<div class="result-card">';
  html += '<span class="result-badge ' + d.badge + '">' + d.badgeText + '</span>';
  html += '<h2 class="result-title">' + d.title + '</h2>';
  html += '<p class="result-desc">' + d.desc + '</p>';
  html += '<div class="result-action">' + d.action + '</div>';
  html += '<div class="result-action"><strong>推奨診療科：</strong>' + d.dept + '</div>';
  html += '<div class="result-note">';
  html += '<strong>あなたの回答：</strong><br>';
  html += "症状の部位：" + getLabelFor("location", answers.location) + '<br>';
  html += "症状のトリガー：" + getLabelFor("trigger", answers.trigger) + '<br>';
  html += "危険サイン：" + getLabelFor("danger_signs", answers.danger_signs) + '<br>';
  html += "期間：" + getLabelFor("duration", answers.duration) + '<br>';
  html += "スマホ・パソコン使用時間：" + getLabelFor("screen_time", answers.screen_time) + '<br>';
  html += "姿勢変换での変化：" + getLabelFor("posture_relief", answers.posture_relief);
  html += '</div></div>';
  html += '<button class="restart-btn" onclick="restart()">もう一度チェックする</button>';
  return html;
}

function getLabelFor(qId, optId) {
  for (var i = 0; i < questions.length; i++) {
    if (questions[i].id === qId) {
      for (var j = 0; j < questions[i].options.length; j++) {
        if (questions[i].options[j].id === optId) { return questions[i].options[j].label; }
      }
    }
  }
  return "";
}

function restart() {
  currentStep = 0; answers = {};
  document.getElementById("resultArea").classList.add("hidden");
  document.getElementById("resultArea").innerHTML = "";
  document.getElementById("questionArea").classList.remove("hidden");
  renderQuestion();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

renderQuestion();
</script>
</body>
</html>

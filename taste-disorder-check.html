<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2C5AA0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>味覚障害セルフチェック ― その症状、大丈夫？</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "BIZ UDPGothic", sans-serif; background: #f0f4f8; color: #333; line-height: 1.6; min-height: 100vh; }
.app-header { background: linear-gradient(135deg, #1B3A5C, #2C5AA0); color: #fff; padding: 16px 20px; text-align: center; }
.app-header h1 { font-size: 1.3rem; margin-bottom: 4px; }
.app-header .series { font-size: 0.8rem; opacity: 0.8; }
.disclaimer { background: #fff3cd; border-left: 4px solid #ffc107; padding: 12px 16px; margin: 12px 16px; border-radius: 4px; font-size: 0.85rem; color: #856404; }
.container { max-width: 600px; margin: 0 auto; padding: 0 16px 80px; }
.step-card { background: #fff; border-radius: 12px; padding: 20px; margin: 16px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.step-number { display: inline-block; background: #2C5AA0; color: #fff; font-size: 0.8rem; padding: 2px 10px; border-radius: 12px; margin-bottom: 8px; }
.step-card h2 { font-size: 1.1rem; color: #1B3A5C; margin-bottom: 12px; }
.step-card p { font-size: 0.95rem; color: #555; margin-bottom: 12px; }
.options { display: flex; flex-direction: column; gap: 8px; }
.option-btn { display: block; width: 100%; padding: 14px 16px; border: 2px solid #dee2e6; border-radius: 8px; background: #fff; font-size: 1rem; font-family: inherit; color: #333; text-align: left; cursor: pointer; transition: all 0.2s; }
.option-btn:hover { border-color: #2C5AA0; background: #f0f6ff; }
.option-btn.selected { border-color: #2C5AA0; background: #e8f4fd; color: #1B3A5C; font-weight: bold; }
.hidden { display: none; }
.result-card { background: #fff; border-radius: 12px; padding: 24px 20px; margin: 16px 0; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
.result-badge { display: inline-block; padding: 6px 16px; border-radius: 20px; font-size: 1.1rem; font-weight: bold; margin-bottom: 12px; }
.badge-red { background: #f8d7da; color: #c0392b; }
.badge-yellow { background: #fff3cd; color: #856404; }
.badge-green { background: #d4edda; color: #155724; }
.result-title { font-size: 1.2rem; color: #1B3A5C; margin-bottom: 8px; }
.result-desc { font-size: 0.95rem; color: #555; margin-bottom: 16px; }
.result-action { background: #f8f9fa; border-radius: 8px; padding: 12px 16px; margin-bottom: 12px; }
.result-action strong { color: #2C5AA0; }
.result-note { font-size: 0.85rem; color: #888; border-top: 1px solid #eee; padding-top: 12px; margin-top: 12px; }
.restart-btn { display: block; width: 100%; padding: 14px; background: #2C5AA0; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-family: inherit; cursor: pointer; margin-top: 12px; }
.restart-btn:hover { background: #1B3A5C; }
.back-link { display: block; text-align: center; padding: 8px 16px; font-size: 0.85rem; color: #fff; text-decoration: none; background: rgba(255,255,255,0.15); }
.back-link:hover { background: rgba(255,255,255,0.25); }
.progress-bar { height: 4px; background: #dee2e6; margin: 0 16px; border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: #2C5AA0; transition: width 0.3s; border-radius: 2px; }
</style>
</head>
<body>
<div class="app-header">
  <a class="back-link" href="index.html">← ツール一覧に戻る</a>
  <div class="series">その症状、大丈夫？ #14</div>
  <h1>味覚障害セルフチェック</h1>
</div>
<div class="disclaimer">このツールは医療行為ではありません。結果は参考情報であり、診断に代わるものではありません。心配な場合は必ず医師にご相談ください。</div>
<div class="blog-link" style="background:#e8f4fd;border-left:4px solid #2C5AA0;padding:10px 16px;margin:12px 16px 0;border-radius:4px;font-size:0.85rem;">📖 <a href="https://hinyan1016.hatenablog.com/entry/2026/05/09/070013" target="_blank" rel="noopener" style="color:#2C5AA0;text-decoration:underline;">ブログ記事「味がしない・味が変わった―コロナだけじゃない味覚障害の原因」で詳しく解説</a></div>
<div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
<div class="container">
  <div id="questionArea"></div>
  <div id="resultArea" class="hidden"></div>
</div>
<script>
var questions = [
  {
    id: "type",
    title: "味覚の問題はどのような環境ですか？",
    subtitle: "",
    options: [
      { id: "reduced", label: "味が薄れた、感じにくくなった（味覚低下）" },
      { id: "absent", label: "味がまったくわからない（味覚消失）" },
      { id: "distorted", label: "味が変わった、へんな味がする（異味症）" },
      { id: "spontaneous", label: "何も食べていないのに味がする（自発性異常味覚）" }
    ]
  },
  {
    id: "neuro",
    title: "味覚以外にこれらの症状はありますか？",
    subtitle: "最も当てはまるものを選んでください",
    options: [
      { id: "speech_palsy", label: "口がまわる、顔の片側が動かない（顔面神経麻痺）" },
      { id: "limb_weak", label: "手足の脅けや疺れがある" },
      { id: "numbness", label: "口まわりや手足にヒリヒリ感やしびれがある" },
      { id: "none", label: "上記の症状はない" }
    ]
  },
  {
    id: "onset",
    title: "味覚の問題はいつごろからですか？",
    subtitle: "",
    options: [
      { id: "sudden", label: "数日以内に突然おかしくなった" },
      { id: "over2weeks", label: "、2週間以上続いている" },
      { id: "after_cold", label: "風邪や感染症の後からおかしくなった" },
      { id: "with_covid", label: "新型コロナ（COVID-19）にかかった後から" }
    ]
  },
  {
    id: "medication",
    title: "現在、これらの薬を飲んでいますか？",
    subtitle: "当てはまるものを選んでください",
    options: [
      { id: "ace_arb", label: "降圧薬（ACE阻害薬・ ARB等）を飲んでいる" },
      { id: "antibiotic", label: "抗生物質（抗菌薬）を飲んでいる" },
      { id: "anticancer", label: "抗がん剤や免疫抑制剤を飲んでいる" },
      { id: "none", label: "これらの薬は飲んでいない" }
    ]
  },
  {
    id: "zinc",
    title: "次のうち、当てはまるものはありますか？",
    subtitle: "亜邉不足のリスクを確認します",
    options: [
      { id: "poor_diet", label: "唄り一辺倒、野菜や肉をあまり食べない" },
      { id: "elderly_alcohol", label: "高齢（65歳以上）またはお酒を多く飲む" },
      { id: "weight_loss", label: "体重が減っている、食欲が落ちた" },
      { id: "none", label: "これらは当てはまらない" }
    ]
  },
  {
    id: "drymouth",
    title: "口の内側の主な状態は？",
    subtitle: "",
    options: [
      { id: "dry", label: "口が一常に山岥い（口渴症）" },
      { id: "only_dry", label: "口が一岥いときだけ味がうすまれる" },
      { id: "normal", label: "口の内側は特に気にならない" }
    ]
  }
];

var currentStep = 0;
var answers = {};

function renderQuestion() {
  var area = document.getElementById("questionArea");
  var q = questions[currentStep];
  var pct = Math.round((currentStep / questions.length) * 100);
  document.getElementById("progressFill").style.width = pct + "%";
  var html = '<div class="step-card">';
  html += '<span class="step-number">' + "質問 " + (currentStep + 1) + " / " + questions.length + '</span>';
  html += '<h2>' + q.title + '</h2>';
  if (q.subtitle) { html += '<p>' + q.subtitle + '</p>'; }
  html += '<div class="options">';
  for (var i = 0; i < q.options.length; i++) {
    var opt = q.options[i];
    html += '<button class="option-btn" onclick="selectAnswer(\'' + q.id + '\',\'' + opt.id + '\')">' + opt.label + '</button>';
  }
  html += '</div></div>';
  area.innerHTML = html;
}

function selectAnswer(qId, optId) {
  answers[qId] = optId;
  currentStep++;
  if (currentStep < questions.length) {
    renderQuestion();
    window.scrollTo({ top: 0, behavior: "smooth" });
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById("questionArea").classList.add("hidden");
  document.getElementById("progressFill").style.width = "100%";
  var urgency = calcUrgency();
  var resultArea = document.getElementById("resultArea");
  resultArea.classList.remove("hidden");
  resultArea.innerHTML = buildResultHTML(urgency);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function calcUrgency() {
  if (answers.neuro === "speech_palsy" || answers.neuro === "limb_weak") { return "emergency_stroke"; }
  if (answers.neuro === "numbness") { return "urgent_neuro"; }
  if (answers.medication === "anticancer") { return "urgent_anticancer"; }
  if (answers.medication === "ace_arb" || answers.medication === "antibiotic") { return "urgent_medication"; }
  if (answers.onset === "over2weeks") { return "urgent_prolonged"; }
  if (answers.zinc === "weight_loss") { return "urgent_weightloss"; }
  if (answers.drymouth === "dry") { return "consult_drymouth"; }
  if (answers.onset === "with_covid") { return "watch_covid"; }
  if (answers.onset === "after_cold") { return "watch_postcold"; }
  if (answers.drymouth === "only_dry") { return "watch_drymouth_only"; }
  return "watch_ok";
}

function buildResultHTML(urgency) {
  var data = {
    emergency_stroke: {
      badge: "badge-red", badgeText: "今すぐ119番へ",
      title: "脳梗塞・脳出血の可能性があります",
      desc: "味覚障害に加えて口がまわる・顔の片側麻痺・手足の脅けがある場合、脳卒中（脳梗塞・脳出血）の可能性があります。一刻も早く救急搬送が必要です。",
      action: "<strong>今すぐ119番に電話してください。</strong>",
      dept: "救急科（119番）・脳神経内科"
    },
    urgent_neuro: {
      badge: "badge-yellow", badgeText: "早めに受診してください",
      title: "神経症状を伴う味覚障害は精査が必要です",
      desc: "口まわりや手足のしびれが味覚障害と一緒に起きている場合、脳神経または末梢神経の病変の可能性があります。症状が新しいうちに診察を受けましょう。",
      action: "<strong>脳神経内科を受診してください。</strong>頭部MRIなどの画像検査が必要になる場合があります。",
      dept: "脳神経内科"
    },
    urgent_anticancer: {
      badge: "badge-yellow", badgeText: "早めに受診してください",
      title: "抗がん剤による味覚障害の可能性があります",
      desc: "抗がん剤・免疫抑制剤は味覚障害の主要な原因の一つです。治療中の広求思吓潜健察チームあるいは投薬電話相誰窓口にお知らせください。",
      action: "<strong>広求豌当者の健快を政内庭に持ったものでなく、症状を担当医に伝えましょう。</strong>",
      dept: "担当医・耳鼻和和科"
    },
    urgent_medication: {
      badge: "badge-yellow", badgeText: "受診をおすすめします",
      title: "薬剤による味覚障害の可能性があります",
      desc: "ACE阻害薬や抗生物質は味覚障害の原因になることがあります。自分勥めに薬を中止せず、まず分主か替え薬を相談しましょう。",
      action: "<strong>分主に症状を伝え、薬の変更を相談してください。</strong>",
      dept: "内科・耳鼻和和科"
    },
    urgent_prolonged: {
      badge: "badge-yellow", badgeText: "受診をおすすめします",
      title: "2週間以上続く味覚障害は棄置しないで",
      desc: "味覚障害が2週間以上続く場合、亜邉不足・味覚神経障害・干煱症などの原因が考えられます。早期に診察を受けることで治療が若います。",
      action: "<strong>耳鼻和和科を受診してください。</strong>血液検査（亜邉値など）が必要になる場合があります。",
      dept: "耳鼻和和科"
    },
    urgent_weightloss: {
      badge: "badge-yellow", badgeText: "受診をおすすめします",
      title: "体重減少を伴う味覚障害は検査が必要です",
      desc: "味覚障害に伴って食欲低下や体重減少が起きている場合、栄養不起や他の疾患の関与も考えられます。早めに診察を受けましょう。",
      action: "<strong>耳鼻和和科または内科を受診してください。</strong>",
      dept: "耳鼻和和科・内科"
    },
    consult_drymouth: {
      badge: "badge-yellow", badgeText: "受診を検討してください",
      title: "口渴症による味覚障害の可能性があります",
      desc: "唯液は味覚を伝えるために必要です。口が常に乾いている場合、シェーグレン症候群・値活症・薬剰の副作用などによる口渴症が味覚障害を引き起こしている場合があります。",
      action: "<strong>耳鼻和和科または口腔外科を受診してください。</strong>",
      dept: "耳鼻和和科・口腔外科"
    },
    watch_covid: {
      badge: "badge-green", badgeText: "様子を見ても大丈夫です",
      title: "COVID-19後の味覚障害は徐々に回復することが多いです",
      desc: "新型コロナ後の味覚障害（長期コロナ症状）は数週間～数ヶ月で回復する報告が多いです。味の練習（味覚リハビリ）が効果的な場合があります。",
      action: "<strong>2週間以上改善しない場合は耳鼻和和科を受診してください。</strong>",
      dept: "症状が続く場合：耳鼻和和科"
    },
    watch_postcold: {
      badge: "badge-green", badgeText: "様子を見ても大丈夫です",
      title: "風邪後の味覚障害は回復しやすいです",
      desc: "風邪・小許びた後に鼻腔・偉岌烎の炎症で味覚が低下することがあります。夢の炎症が落ち着けば味覚は改善することが多いです。",
      action: "<strong>1週間以上改善しない場合は耳鼻和和科を受診してください。</strong>",
      dept: "症状が続く場合：耳鼻和和科"
    },
    watch_drymouth_only: {
      badge: "badge-green", badgeText: "様子を見ても大丈夫です",
      title: "口が渴いときだけ味がうすまれる場合は水分補給が先決です",
      desc: "啓液が減ると味覚物質が味榕に届きにくくなり、味が感じにくくなります。十分な水分摂取や口内を湿わせることで改善することがあります。",
      action: "<strong>水分を十分に摂り、症状が続く場合は耳鼻和和科を受診してください。</strong>",
      dept: "症状が続く場合：耳鼻和和科"
    },
    watch_ok: {
      badge: "badge-green", badgeText: "様子を見ても大丈夫です",
      title: "緊急性は低そうです",
      desc: "現時点で危険なサインは見られません。味覚障害が1週間以上続く場合や悪化する場合は耳鼻和和科を受診してください。",
      action: "<strong>症状が悪化したり、新たな症状が出たら受診してください。</strong>",
      dept: "悪化時：耳鼻和和科"
    }
  };

  var d = data[urgency];
  var html = '<div class="result-card">';
  html += '<span class="result-badge ' + d.badge + '">' + d.badgeText + '</span>';
  html += '<h2 class="result-title">' + d.title + '</h2>';
  html += '<p class="result-desc">' + d.desc + '</p>';
  html += '<div class="result-action">' + d.action + '</div>';
  html += '<div class="result-action"><strong>推奨診療科：</strong>' + d.dept + '</div>';
  html += '<div class="result-note">';
  html += '<strong>あなたの回答：</strong><br>';
  html += "味覚の問題：" + getLabelFor("type", answers.type) + '<br>';
  html += "神経症状：" + getLabelFor("neuro", answers.neuro) + '<br>';
  html += "発症時期：" + getLabelFor("onset", answers.onset) + '<br>';
  html += "薬剰：" + getLabelFor("medication", answers.medication) + '<br>';
  html += "亜邉リスク：" + getLabelFor("zinc", answers.zinc) + '<br>';
  html += "口の主な状態：" + getLabelFor("drymouth", answers.drymouth);
  html += '</div></div>';
  html += '<button class="restart-btn" onclick="restart()">もう一度チェックする</button>';
  return html;
}

function getLabelFor(qId, optId) {
  for (var i = 0; i < questions.length; i++) {
    if (questions[i].id === qId) {
      for (var j = 0; j < questions[i].options.length; j++) {
        if (questions[i].options[j].id === optId) { return questions[i].options[j].label; }
      }
    }
  }
  return "";
}

function restart() {
  currentStep = 0; answers = {};
  document.getElementById("resultArea").classList.add("hidden");
  document.getElementById("resultArea").innerHTML = "";
  document.getElementById("questionArea").classList.remove("hidden");
  renderQuestion();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

renderQuestion();
</script>
</body>
</html>

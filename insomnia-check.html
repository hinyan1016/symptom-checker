<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2C5AA0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>不眠セルフチェック ― その症状、大丈夫？</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "BIZ UDPGothic", sans-serif; background: #f0f4f8; color: #333; line-height: 1.6; min-height: 100vh; }
.app-header { background: linear-gradient(135deg, #1B3A5C, #2C5AA0); color: #fff; padding: 16px 20px; text-align: center; }
.app-header h1 { font-size: 1.3rem; margin-bottom: 4px; }
.app-header .series { font-size: 0.8rem; opacity: 0.8; }
.disclaimer { background: #fff3cd; border-left: 4px solid #ffc107; padding: 12px 16px; margin: 12px 16px; border-radius: 4px; font-size: 0.85rem; color: #856404; }
.container { max-width: 600px; margin: 0 auto; padding: 0 16px 80px; }
.step-card { background: #fff; border-radius: 12px; padding: 20px; margin: 16px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.step-number { display: inline-block; background: #2C5AA0; color: #fff; font-size: 0.8rem; padding: 2px 10px; border-radius: 12px; margin-bottom: 8px; }
.step-card h2 { font-size: 1.1rem; color: #1B3A5C; margin-bottom: 12px; }
.step-card p { font-size: 0.95rem; color: #555; margin-bottom: 12px; }
.options { display: flex; flex-direction: column; gap: 8px; }
.option-btn { display: block; width: 100%; padding: 14px 16px; border: 2px solid #dee2e6; border-radius: 8px; background: #fff; font-size: 1rem; font-family: inherit; color: #333; text-align: left; cursor: pointer; transition: all 0.2s; }
.option-btn:hover { border-color: #2C5AA0; background: #f0f6ff; }
.option-btn.selected { border-color: #2C5AA0; background: #e8f4fd; color: #1B3A5C; font-weight: bold; }
.hidden { display: none; }
.result-card { background: #fff; border-radius: 12px; padding: 24px 20px; margin: 16px 0; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
.result-badge { display: inline-block; padding: 6px 16px; border-radius: 20px; font-size: 1.1rem; font-weight: bold; margin-bottom: 12px; }
.badge-red { background: #f8d7da; color: #c0392b; }
.badge-yellow { background: #fff3cd; color: #856404; }
.badge-green { background: #d4edda; color: #155724; }
.result-title { font-size: 1.2rem; color: #1B3A5C; margin-bottom: 8px; }
.result-desc { font-size: 0.95rem; color: #555; margin-bottom: 16px; }
.result-action { background: #f8f9fa; border-radius: 8px; padding: 12px 16px; margin-bottom: 12px; }
.result-action strong { color: #2C5AA0; }
.result-note { font-size: 0.85rem; color: #888; border-top: 1px solid #eee; padding-top: 12px; margin-top: 12px; }
.restart-btn { display: block; width: 100%; padding: 14px; background: #2C5AA0; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-family: inherit; cursor: pointer; margin-top: 12px; }
.restart-btn:hover { background: #1B3A5C; }
.back-link { display: block; text-align: center; padding: 8px 16px; font-size: 0.85rem; color: #fff; text-decoration: none; background: rgba(255,255,255,0.15); }
.back-link:hover { background: rgba(255,255,255,0.25); }
.progress-bar { height: 4px; background: #dee2e6; margin: 0 16px; border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: #2C5AA0; transition: width 0.3s; border-radius: 2px; }
</style>
</head>
<body>
<div class="app-header">
  <a class="back-link" href="index.html">← ツール一覧に戻る</a>
  <div class="series">その症状、大丈夫？ #15</div>
  <h1>不眠セルフチェック</h1>
</div>
<div class="disclaimer">このツールは医療行為ではありません。結果は参考情報であり、診断に代わるものではありません。心配な場合は必ず医師にご相談ください。</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
<div class="container">
  <div id="questionArea"></div>
  <div id="resultArea" class="hidden"></div>
</div>
<script>
var questions = [
  {
    id: "type",
    title: "不眠のタイプはどれに該当しますか？",
    subtitle: "最も当てはまるものを選んでください",
    options: [
      { id: "sleep_onset", label: "寅に入れない（入眠障害）" },
      { id: "maintenance", label: "夜中に何度も目が覚める（中途覚醒）" },
      { id: "early_waking", label: "早朝早く目が覚めてしまう（早朝覚醒）" },
      { id: "unrefreshing", label: "寅ているのに眠れた気がしない（熟眠障害）" }
    ]
  },
  {
    id: "duration",
    title: "不眠はどのくらい続いていますか？",
    subtitle: "",
    options: [
      { id: "under2w", label: "2週間未満（最近始まった）" },
      { id: "2w_1m", label: "2週間〜1か月程度" },
      { id: "over1m", label: "1か月以上続いている" },
      { id: "over3m", label: "3か月以上長期間続いている" }
    ]
  },
  {
    id: "daytime",
    title: "旼間の状態はどうですか？",
    subtitle: "",
    options: [
      { id: "accident_risk", label: "運転中や作業中に居眠りしそうになる（事故を起こしそう）" },
      { id: "daily_impaired", label: "仕事・学業・日常生活に支障がある" },
      { id: "tired", label: "疲れや毅追いがあるがなんとかやれている" },
      { id: "ok", label: "旼間は特に問題ない" }
    ]
  },
  {
    id: "accompanying",
    title: "不眠に伴って気になることはありますか？",
    subtitle: "最も当てはまるものを選んでください",
    options: [
      { id: "depression_suicidal", label: "死にたい、消えたいという気持ちがある" },
      { id: "depression_only", label: "気分が沈み、何も楽しめない状態が続く" },
      { id: "rem_behavior", label: "眠り中にたたき打ったり、夢の内容を演じてしまう" },
      { id: "snoring_apnea", label: "いびきや眠中の呼吸停止を指摘されたことがある" },
      { id: "none", label: "特に伴う症状はない" }
    ]
  },
  {
    id: "habits",
    title: "睡眠に関する習慣で当てはまるものは？",
    subtitle: "最も当てはまるものを選んでください",
    options: [
      { id: "caffeine_alcohol", label: "就尽前にカフェインやアルコールを摂取することが多い" },
      { id: "screen", label: "就尽前1時間以内までスマホやパソコンを使っている" },
      { id: "irregular", label: "起序時刻が日ごと大きくずれる" },
      { id: "none", label: "特に思い当たらない" }
    ]
  },
  {
    id: "medication",
    title: "薬剤・物質の使用はありますか？",
    subtitle: "",
    options: [
      { id: "sleeping_pill", label: "睡眠薬や抗不安薬を現在就用中だが效かなくなってきた" },
      { id: "self_medication", label: "市販の睡眠改善薄やサプリを自分で起ってきた" },
      { id: "steroid_other", label: "ステロイド・抗げん薄・投び薄などを展开中" },
      { id: "none", label: "特にない" }
    ]
  }
];

var currentStep = 0;
var answers = {};

function renderQuestion() {
  var area = document.getElementById("questionArea");
  var q = questions[currentStep];
  var pct = Math.round((currentStep / questions.length) * 100);
  document.getElementById("progressFill").style.width = pct + "%";
  var html = '<div class="step-card">';
  html += '<span class="step-number">' + "質問 " + (currentStep + 1) + " / " + questions.length + '</span>';
  html += '<h2>' + q.title + '</h2>';
  if (q.subtitle) { html += '<p>' + q.subtitle + '</p>'; }
  html += '<div class="options">';
  for (var i = 0; i < q.options.length; i++) {
    var opt = q.options[i];
    html += '<button class="option-btn" onclick="selectAnswer(\'' + q.id + '\',\'' + opt.id + '\')">' + opt.label + '</button>';
  }
  html += '</div></div>';
  area.innerHTML = html;
}

function selectAnswer(qId, optId) {
  answers[qId] = optId;
  currentStep++;
  if (currentStep < questions.length) {
    renderQuestion();
    window.scrollTo({ top: 0, behavior: "smooth" });
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById("questionArea").classList.add("hidden");
  document.getElementById("progressFill").style.width = "100%";
  var urgency = calcUrgency();
  var resultArea = document.getElementById("resultArea");
  resultArea.classList.remove("hidden");
  resultArea.innerHTML = buildResultHTML(urgency);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function calcUrgency() {
  // RED: suicidal ideation
  if (answers.accompanying === "depression_suicidal") { return "emergency_suicidal"; }
  // RED: near-accident due to daytime sleepiness
  if (answers.daytime === "accident_risk") { return "emergency_accident"; }
  // YELLOW: REM sleep behavior disorder signs
  if (answers.accompanying === "rem_behavior") { return "urgent_rem"; }
  // YELLOW: sleep apnea signs
  if (answers.accompanying === "snoring_apnea") { return "urgent_apnea"; }
  // YELLOW: chronic insomnia (over 1 month) with daily impairment
  if ((answers.duration === "over1m" || answers.duration === "over3m") && answers.daytime === "daily_impaired") { return "urgent_chronic"; }
  // YELLOW: sleeping pill no longer effective
  if (answers.medication === "sleeping_pill") { return "urgent_medication"; }
  // YELLOW: depression without suicidal ideation, lasting insomnia
  if (answers.accompanying === "depression_only" && (answers.duration === "over1m" || answers.duration === "over3m")) { return "urgent_depression"; }
  // GREEN: lifestyle-related
  if (answers.habits === "caffeine_alcohol" || answers.habits === "screen" || answers.habits === "irregular") { return "watch_lifestyle"; }
  // GREEN: short duration / manageable
  return "watch_ok";
}

function buildResultHTML(urgency) {
  var data = {
    emergency_suicidal: {
      badge: "badge-red", badgeText: "今すぐ相談してください",
      title: "こまれた気持ちがあるときは一人で抑え込まないでください",
      desc: "死や消えてしまいたいという気持ちは、これ以上ない苦しみのサインです。不眠とうつは銷に合岡しやすく、一度誤れた達成を著けることはありません。お嬈しの方やプロに必ず話してください。",
      action: "<strong>いのちの電話相談窓口：0120-783-556（無料・24時間）</strong><br>または心脈內科・精神科を早めに受診してください。",
      dept: "精神科・心療内科"
    },
    emergency_accident: {
      badge: "badge-red", badgeText: "貫任があります",
      title: "運転中・作業中の居眠りは重大なリスクです",
      desc: "居眠りによる事故リスクがある状態では、運転や危険作業を一時中止することが必要です。睡眠時無呼吸症候群（睡眠時無呼吸）の可能性があります。",
      action: "<strong>達き次第早めに睡眠外来または脳神経内科を受診してください。</strong>睡眠時無呼吸の精査（睡眠検査）が可能です。",
      dept: "睡眠外来・脳神経内科"
    },
    urgent_rem: {
      badge: "badge-yellow", badgeText: "早めに受診してください",
      title: "REM睡眠行動障害の可能性があります",
      desc: "眠り中に夢の内容を演じてしまう（たたき打つ・展脳れる）場合、REM睡眠行動障害という病態の可能性があります。パーキンソン病など神経変性疾氇の前駆症となることがあります。",
      action: "<strong>脳神経内科または睡眠外来を受診してください。</strong>睡眠検査（PSG）による診断が必要です。",
      dept: "脳神経内科・睡眠外来"
    },
    urgent_apnea: {
      badge: "badge-yellow", badgeText: "受診をおすすめします",
      title: "睡眠時無呼吸症候群の可能性があります",
      desc: "いびきや就尽中の呼吸停止は睡眠時無呼吸症候群（SAS）の典型的なサインです。日中の居眠りや富血管疾氇（高血圧・心房細動）のリスクを高めます。",
      action: "<strong>睡眠外来または耳鼻咽科を受診してください。</strong>簽商型アアレビュー等の简易検査で診断できます。",
      dept: "睡眠外来・耳鼻咽科・脳神経内科"
    },
    urgent_chronic: {
      badge: "badge-yellow", badgeText: "受診を検討してください",
      title: "1か月以上続く不眠は治療が必要です",
      desc: "1か月以上の慢性不眠は、不眠症の診断基準を満たしています。軽眠薄より認知行動療法（CBT-I）や適切な薬物療法が効果的です。",
      action: "<strong>睡眠外来または心療内科を受診してください。</strong>我慢しずに相談しましょう。",
      dept: "睡眠外来・心療内科・精神科"
    },
    urgent_medication: {
      badge: "badge-yellow", badgeText: "受診をおすすめします",
      title: "睡眠薬の見直しが必要かもしれません",
      desc: "現在の睡眠薬が効かなくなってきた場合、該当薬の変更やCBT-Iへの変更が効果的なことがあります。自分で增量はせず、処方の先生に必ず相談してください。",
      action: "<strong>処方している医師または睡眠外来に相談してください。</strong>",
      dept: "睡眠外来・心療内科・精神科"
    },
    urgent_depression: {
      badge: "badge-yellow", badgeText: "早めに受診してください",
      title: "うつが不眠の背景にある可能性があります",
      desc: "不眠と気分の沈みが重なる場合、うつ病や不安障害などが不眠の原因となっていることがあります。視点を変えた適切な治療が有効です。",
      action: "<strong>心療内科または精神科を受診してください。</strong>気分と睡眠を一度に診てもらえます。",
      dept: "精神科・心療内科"
    },
    watch_lifestyle: {
      badge: "badge-green", badgeText: "様子を見ても大丈夫です",
      title: "生活習慣の見直しで改善が期待できます",
      desc: "カフェイン・アルコール・スクリーン・不規則な生活リズムは不眠の主な原因です。スリープハイジーンを討ることで原定で大幅に改善する可能性があります。",
      action: "<strong>就尽2時間前までカフェイン・アルコールを避け、スマホは就尽前にブルーライトカット。毎日同じ時刻に起序床することが基本です。</strong>",
      dept: "改善なければ：睡眠外来・心療内科"
    },
    watch_ok: {
      badge: "badge-green", badgeText: "様子を見ても大丈夫です",
      title: "一時的な不眠の可能性が高いです",
      desc: "ストレスや環境変化による一時的な不眠で、目立った危険なサインは見られません。無理に寅ようとしないこと、おふとんの入尽までの居場でリラックスすることが最充分な対処です。",
      action: "<strong>2週間以上改善しない場合は睡眠外来または心療内科へ。</strong>",
      dept: "悪化時：睡眠外来・心療内科"
    }
  };

  var d = data[urgency];
  var html = '<div class="result-card">';
  html += '<span class="result-badge ' + d.badge + '">' + d.badgeText + '</span>';
  html += '<h2 class="result-title">' + d.title + '</h2>';
  html += '<p class="result-desc">' + d.desc + '</p>';
  html += '<div class="result-action">' + d.action + '</div>';
  html += '<div class="result-action"><strong>推奨診療科：</strong>' + d.dept + '</div>';
  html += '<div class="result-note">';
  html += '<strong>あなたの回答：</strong><br>';
  html += "不眠のタイプ：" + getLabelFor("type", answers.type) + '<br>';
  html += "持続期間：" + getLabelFor("duration", answers.duration) + '<br>';
  html += "旼間の状態：" + getLabelFor("daytime", answers.daytime) + '<br>';
  html += "伴う症状：" + getLabelFor("accompanying", answers.accompanying) + '<br>';
  html += "生活習慣：" + getLabelFor("habits", answers.habits) + '<br>';
  html += "薬剤・物質：" + getLabelFor("medication", answers.medication);
  html += '</div></div>';
  html += '<button class="restart-btn" onclick="restart()">もう一度チェックする</button>';
  return html;
}

function getLabelFor(qId, optId) {
  for (var i = 0; i < questions.length; i++) {
    if (questions[i].id === qId) {
      for (var j = 0; j < questions[i].options.length; j++) {
        if (questions[i].options[j].id === optId) { return questions[i].options[j].label; }
      }
    }
  }
  return "";
}

function restart() {
  currentStep = 0; answers = {};
  document.getElementById("resultArea").classList.add("hidden");
  document.getElementById("resultArea").innerHTML = "";
  document.getElementById("questionArea").classList.remove("hidden");
  renderQuestion();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

renderQuestion();
</script>
</body>
</html>
